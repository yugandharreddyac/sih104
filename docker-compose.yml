version: '3.8'

networks:
  voxshield-net:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: voxshield-postgres
    restart: unless-stopped
    networks:
      - voxshield-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER?err_missing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?err_missing_password}
      POSTGRES_DB: ${POSTGRES_DB?err_missing_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voxshield-redis
    restart: unless-stopped
    networks:
      - voxshield-net
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD?err_missing_redis_password}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD?err_missing_redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai
    container_name: voxshield-ai
    restart: unless-stopped
    networks:
      - voxshield-net
    environment:
      - VOXSHIELD_AI_PORT=8000
      - VOXSHIELD_AI_HOST=0.0.0.0
      - VOXSHIELD_AI_ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: voxshield-backend
    restart: unless-stopped
    networks:
      - voxshield-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER?err_missing_user}:${POSTGRES_PASSWORD?err_missing_password}@postgres:5432/${POSTGRES_DB?err_missing_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD?err_missing_redis_password}@redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET?err_missing_jwt}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY?err_missing_encryption}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET?err_missing_webhook}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD?err_missing_seed_password}
      - INTERVENTION_WEBHOOK_URL=${INTERVENTION_WEBHOOK_URL:-}
      - RTP_UDP_PORT=10000
    ports:
      - "4000:4000"
      - "10000:10000/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    container_name: voxshield-frontend
    restart: unless-stopped
    networks:
      - voxshield-net
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    ports:
      - "3000:3000"
