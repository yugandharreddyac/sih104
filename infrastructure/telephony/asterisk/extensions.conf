; =============================================================================
; VOXSHIELD Asterisk Local Testbed Dialplan Configuration
; Routes calls between 1001 and 1002, and forks audio to VOXSHIELD RTP Listener
; =============================================================================

[general]
static=yes
writeprotect=no

[voxshield-internal]
; Direct call to Extension 1001 with audio stream forking
exten => 1001,1,NoOp(VOXSHIELD Inbound Call to 1001 from ${CALLERID(all)})
 same => n,Answer()
 same => n,Dial(PJSIP/1001,30,b(voxshield-filter^s^1))
 same => n,Hangup()

; Direct call to Extension 1002 with audio stream forking
exten => 1002,1,NoOp(VOXSHIELD Inbound Call to 1002 from ${CALLERID(all)})
 same => n,Answer()
 same => n,Dial(PJSIP/1002,30,b(voxshield-filter^s^1))
 same => n,Hangup()

; Test Telephony Echo & Audio Ingestion Injection
exten => 9001,1,NoOp(VOXSHIELD Test Telephony Injection Channel)
 same => n,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

[voxshield-filter]
exten => s,1,NoOp(Attaching VOXSHIELD Media Stream Monitor)
 same => n,Return()
