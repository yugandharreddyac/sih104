; =============================================================================
; VOXSHIELD Asterisk Local Testbed PJSIP Configuration
; Configures softphone extensions 1001 and 1002 with UDP transport and G.711
; =============================================================================

[global]
type=global
user_agent=VOXSHIELD-Asterisk-Testbed-v1.0

; --- UDP Transport ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Endpoint Template ---
[endpoint-template](!)
type=endpoint
context=voxshield-internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

; --- Extension 1001 ---
[1001-auth]
type=auth
auth_type=userpass
username=1001
password=voxshield_test_pass_1001

[1001-aor]
type=aor
max_contacts=2

[1001](endpoint-template)
auth=1001-auth
aors=1001-aor

; --- Extension 1002 ---
[1002-auth]
type=auth
auth_type=userpass
username=1002
password=voxshield_test_pass_1002

[1002-aor]
type=aor
max_contacts=2

[1002](endpoint-template)
auth=1002-auth
aors=1002-aor
