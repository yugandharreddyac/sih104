<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #6B7280; }
      .text-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #374151; }
      .text-axis { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; fill: #9CA3AF; }
      .text-category { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #4B5563; text-anchor: middle; }
      .text-val-feas { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #2563EB; text-anchor: middle; }
      .text-val-chal { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #DC2626; text-anchor: middle; }
      .text-footer { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #9CA3AF; }
    </style>
  </defs>

  <!-- Presentation Background Canvas (16:9 Widescreen) -->
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Top Title Block -->
  <g transform="translate(60, 55)">
    <text class="text-title" x="0" y="0">Feasibility vs Potential Challenges</text>
    <text class="text-subtitle" x="0" y="24">VOXSHIELD Architecture Feasibility Strengths vs Implementation Risk Vectors</text>

    <!-- Legend (Top Right) -->
    <g transform="translate(850, -5)">
      <!-- Feasibility -->
      <line x1="0" y1="8" x2="28" y2="8" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
      <circle cx="14" cy="8" r="4.5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
      <text class="text-legend" x="38" y="12">Feasibility</text>

      <!-- Challenges -->
      <line x1="120" y1="8" x2="148" y2="8" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
      <circle cx="134" cy="8" r="4.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
      <text class="text-legend" x="158" y="12">Challenges</text>
    </g>

    <!-- Header Divider Rule -->
    <line x1="0" y1="44" x2="1080" y2="44" stroke="#E5E7EB" stroke-width="1"/>
  </g>

  <!-- Chart Canvas Coordinates:
       Chart Area: X: 110 to 1090 (width = 980)
       Chart Area: Y: 160 to 520 (height = 360)
       Y Scale: 0 -> 520, 2 -> 448, 4 -> 376, 6 -> 304, 8 -> 232, 10 -> 160
       X Steps (5 intervals across 980px => 196px each):
       0: 110 (Modular Architecture)
       1: 306 (Low-Cost Deployment)
       2: 502 (100 Concurrent Streams)
       3: 698 (Real-Time Scale Needs)
       4: 894 (Evolving AI Attack Risk)
       5: 1090 (Data Handling Efficiency)
  -->

  <!-- Horizontal Grid Lines (0, 2, 4, 6, 8, 10) -->
  <g>
    <!-- Tick 10 (Y=160) -->
    <line x1="110" y1="160" x2="1090" y2="160" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="text-axis" x="92" y="164" text-anchor="end">10</text>

    <!-- Tick 8 (Y=232) -->
    <line x1="110" y1="232" x2="1090" y2="232" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="text-axis" x="92" y="236" text-anchor="end">8</text>

    <!-- Tick 6 (Y=304) -->
    <line x1="110" y1="304" x2="1090" y2="304" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="text-axis" x="92" y="308" text-anchor="end">6</text>

    <!-- Tick 4 (Y=376) -->
    <line x1="110" y1="376" x2="1090" y2="376" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="text-axis" x="92" y="380" text-anchor="end">4</text>

    <!-- Tick 2 (Y=448) -->
    <line x1="110" y1="448" x2="1090" y2="448" stroke="#F3F4F6" stroke-width="1" stroke-dasharray="4 4"/>
    <text class="text-axis" x="92" y="452" text-anchor="end">2</text>

    <!-- Tick 0 / Baseline (Y=520) -->
    <line x1="110" y1="520" x2="1090" y2="520" stroke="#D1D5DB" stroke-width="1.5"/>
    <text class="text-axis" x="92" y="524" text-anchor="end">0</text>
  </g>

  <!-- Left Y-Axis -->
  <line x1="110" y1="150" x2="110" y2="520" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Feasibility Line (Blue)
       Points:
       0: 110, 196 (Val 9)
       1: 306, 232 (Val 8)
       2: 502, 232 (Val 8)
       3: 698, 448 (Val 2)
       4: 894, 484 (Val 1)
       5: 1090, 484 (Val 1)
  -->
  <polyline
    fill="none"
    stroke="#2563EB"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    points="110,196 306,232 502,232 698,448 894,484 1090,484"
  />

  <!-- Challenges Line (Red)
       Points:
       0: 110, 520 (Val 0)
       1: 306, 520 (Val 0)
       2: 502, 484 (Val 1)
       3: 698, 268 (Val 7)
       4: 894, 232 (Val 8)
       5: 1090, 268 (Val 7)
  -->
  <polyline
    fill="none"
    stroke="#DC2626"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    points="110,520 306,520 502,484 698,268 894,232 1090,268"
  />

  <!-- Data Markers & Score Callouts: Feasibility (Blue) -->
  <g>
    <!-- Point 0: 9 -->
    <circle cx="110" cy="196" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-feas" x="110" y="180">9</text>

    <!-- Point 1: 8 -->
    <circle cx="306" cy="232" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-feas" x="306" y="216">8</text>

    <!-- Point 2: 8 -->
    <circle cx="502" cy="232" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-feas" x="502" y="216">8</text>

    <!-- Point 3: 2 -->
    <circle cx="698" cy="448" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-feas" x="698" y="470">2</text>

    <!-- Point 4: 1 -->
    <circle cx="894" cy="484" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-feas" x="894" y="506">1</text>

    <!-- Point 5: 1 -->
    <circle cx="1090" cy="484" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-feas" x="1090" y="506">1</text>
  </g>

  <!-- Data Markers & Score Callouts: Challenges (Red) -->
  <g>
    <!-- Point 0: 0 -->
    <circle cx="110" cy="520" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-chal" x="110" y="540">0</text>

    <!-- Point 1: 0 -->
    <circle cx="306" cy="520" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-chal" x="306" y="540">0</text>

    <!-- Point 2: 1 -->
    <circle cx="502" cy="484" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-chal" x="502" y="468">1</text>

    <!-- Point 3: 7 -->
    <circle cx="698" cy="268" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-chal" x="698" y="252">7</text>

    <!-- Point 4: 8 -->
    <circle cx="894" cy="232" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-chal" x="894" y="216">8</text>

    <!-- Point 5: 7 -->
    <circle cx="1090" cy="268" r="5" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text class="text-val-chal" x="1090" y="252">7</text>
  </g>

  <!-- X-Axis Category Labels (Multi-line, Non-Overlapping) -->
  <g transform="translate(0, 560)">
    <!-- 0: Modular Architecture -->
    <text class="text-category" x="110" y="0">
      <tspan x="110" dy="0">Modular</tspan>
      <tspan x="110" dy="16">Architecture</tspan>
    </text>

    <!-- 1: Low-Cost Deployment -->
    <text class="text-category" x="306" y="0">
      <tspan x="306" dy="0">Low-Cost</tspan>
      <tspan x="306" dy="16">Deployment</tspan>
    </text>

    <!-- 2: 100 Concurrent Streams -->
    <text class="text-category" x="502" y="0">
      <tspan x="502" dy="0">100 Concurrent</tspan>
      <tspan x="502" dy="16">Streams</tspan>
    </text>

    <!-- 3: Real-Time Scale Needs -->
    <text class="text-category" x="698" y="0">
      <tspan x="698" dy="0">Real-Time</tspan>
      <tspan x="698" dy="16">Scale Needs</tspan>
    </text>

    <!-- 4: Evolving AI Attack Risk -->
    <text class="text-category" x="894" y="0">
      <tspan x="894" dy="0">Evolving AI</tspan>
      <tspan x="894" dy="16">Attack Risk</tspan>
    </text>

    <!-- 5: Data Handling Efficiency -->
    <text class="text-category" x="1090" y="0">
      <tspan x="1090" dy="0">Data Handling</tspan>
      <tspan x="1090" dy="16">Efficiency</tspan>
    </text>
  </g>

  <!-- Bottom Footer Annotation -->
  <g transform="translate(60, 630)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#E5E7EB" stroke-width="1"/>
    <text class="text-footer" x="0" y="20">Analysis: Architecture feasibility remains high through 100 concurrent streams; complexity accelerates as real-time scale and evolving AI attack defenses converge.</text>
    <text class="text-footer" x="1080" y="20" text-anchor="end">Evaluation Metric: 0 (Baseline) – 10 (Critical / Maximum)</text>
  </g>
</svg>
